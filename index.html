
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1>🎓 Student Feedback</h1>
            <p>We value your feedback!</p>
        </div>

        <form id="feedbackForm">
            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>NIET Email</label>
            <input
                type="email"
                id="email"
                placeholder="example@niet.co.in"
                pattern="[a-zA-Z0-9._%+-]+@niet\.co\.in"
                title="Only NIET email (@niet.co.in) is allowed"
                required
            >

            <label>Course</label>
            <input type="text" id="course" placeholder="Enter your course" required>

            <label>Feedback</label>
            <textarea id="feedback" placeholder="Write your feedback..." required></textarea>

            <button type="submit">Submit Feedback ➜</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
